<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frame Coach">
<title>Frame Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--muted:rgba(255,255,255,.72);--advice:#ffd60a;--good:#43a047;--goodLine:#6ee7a8;--bad:#ef5350;--hl:#8b5cf6;--sheet:#1c1c1e;
  color-scheme:dark;box-sizing:border-box;
  --hud:calc(env(safe-area-inset-top,0px) + 118px);--ctrl:calc(env(safe-area-inset-bottom,0px) + 128px);
  --fh:min(100vw*4/3,100dvh - var(--hud) - var(--ctrl));--fw:calc(var(--fh)*3/4);--fl:calc((100vw - var(--fw))/2)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{color:var(--ink);font-family:"Arimo","Liberation Sans",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#overlay{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.dim{position:fixed;left:0;right:0;background:rgba(0,0,0,.38);pointer-events:none}
#dimTop{top:0;height:var(--hud)}
#dimBot{top:calc(var(--hud) + var(--fh));bottom:0}
.dimS{position:fixed;top:var(--hud);height:var(--fh);width:var(--fl);background:rgba(0,0,0,.38);pointer-events:none}
#dimL{left:0}#dimR{right:0}
#frame{position:fixed;left:var(--fl);width:var(--fw);top:var(--hud);height:var(--fh);border:1px solid rgba(255,255,255,.35);touch-action:none}
#preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;-webkit-touch-callout:default}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fl .35s ease-out}@keyframes fl{0%{opacity:.85}100%{opacity:0}}
/* HUD */
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:118px;padding:10px 16px 0;pointer-events:none}
#dot{position:absolute;left:16px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--bad);transition:background .25s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
#dot.good{background:var(--good)}
#lines{margin:0 auto;max-width:calc(100% - 110px);text-align:center;font-size:15px;line-height:1.3;text-shadow:0 1px 5px rgba(0,0,0,.75);display:flex;flex-direction:column;gap:6px}
.blk div{font-size:15px}
.tag{font-size:12px;color:var(--muted);margin-left:6px}
#msg{font-size:15px}
/* inside frame */
#pill{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.3);padding:4px;border-radius:999px}
#pill button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(20,20,20,.65);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative}
#pill button::before{content:"";position:absolute;inset:-4px}
#pill button.on{background:var(--advice);color:#000}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:7px 12px;border-radius:8px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#refBtn{position:absolute;left:12px;bottom:12px;width:min(92px,22%);aspect-ratio:3/4;height:auto;border:2px solid #fff;border-radius:2px;background:rgba(0,0,0,.25) center/cover no-repeat;color:#fff;font:inherit;font-size:13px;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#refBtn.empty{border-style:dashed;border-color:rgba(255,255,255,.75)}
#refBtn.flipped{transform:scaleX(-1)}
#zoom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.3);padding:4px;border-radius:999px}
#zoom button{font:inherit;font-weight:600;font-size:12px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(20,20,20,.65);color:#fff;cursor:pointer;padding:0}
#zoom button.on{color:var(--advice);font-size:13px;width:38px;height:38px}
/* bottom */
#bottom{position:fixed;left:0;right:0;bottom:0;height:var(--ctrl);padding:0 24px env(safe-area-inset-bottom,0px);justify-content:center;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
#bottom>*{pointer-events:auto}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:380px}
#lastBtn{justify-self:start;width:56px;height:56px;border-radius:8px;border:0;background:#222 center/cover no-repeat;cursor:pointer;padding:0}
#lastBtn.none{visibility:hidden}
#flip{justify-self:end;width:56px;height:56px;border-radius:50%;border:0;background:rgba(80,80,80,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:transparent;padding:4px;cursor:pointer}
#shutter::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
#shutter:active::after{transform:scale(.88)}
#shutter:disabled{opacity:.35}
.btns{display:flex;gap:12px;justify-content:center}
.btn{font:inherit;font-weight:600;font-size:16px;padding:13px 20px;border-radius:999px;border:0;background:rgba(80,80,80,.6);color:#fff;cursor:pointer}
.btn.primary{background:#fff;color:#000}
.btn[aria-pressed="true"]{background:var(--advice);color:#000}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--advice);outline-offset:3px}
[hidden]{display:none!important}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
#sheetBox{background:var(--sheet);width:100%;border-radius:14px 14px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:94%;overflow-y:auto}
#sheetHead{display:flex;justify-content:space-between;align-items:center}
#sheetHead h2{margin:0;font-size:18px;font-weight:600}
#big{width:100%;aspect-ratio:3/4;max-height:40vh;object-fit:contain;background:#000;border-radius:10px}
#bigNone{width:100%;aspect-ratio:3/4;max-height:40vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);background:#000;border-radius:10px;padding:20px;line-height:1.4;font-size:15px}
#note{width:100%;min-height:64px;resize:vertical;background:#2c2c2e;color:#fff;border:0;border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;-webkit-user-select:text;user-select:text}
#note::placeholder{color:#8e8e93}
#strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.tile{flex:0 0 auto;width:62px;height:83px;border-radius:6px;border:2px solid transparent;background:#333 center/cover no-repeat;color:#fff;font:inherit;font-size:13px;cursor:pointer}
.tile.sel{border-color:var(--advice)}
.tile.add{background:transparent;border:2px dashed #666;font-size:26px}
#sheetMsg{min-height:1.2em;color:var(--advice);font-size:14px;margin:0}
@media (prefers-reduced-motion:reduce){#flash.on{animation:none}}
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="overlay"></canvas>
<div class="dim" id="dimTop"></div><div class="dim" id="dimBot"></div><div class="dimS" id="dimL"></div><div class="dimS" id="dimR"></div>

<div id="hud">
  <div id="dot" role="img" aria-label="Not ready"></div>
  <div id="lines" aria-live="polite">
    <div class="blk" id="poseBlk" hidden><div id="poseScore"></div><div id="poseTip"></div></div>
    <div class="blk" id="frameBlk" hidden><div><span id="frameScore"></span><span class="tag" id="frameTag"></span></div><div id="frameTips"></div></div>
    <div id="msg">Starting the camera…</div>
  </div>
</div>

<div id="frame">
  <img id="preview" alt="Your photo">
  <div id="pill" hidden>
    <button id="mirrorRef" aria-label="Mirror the reference" aria-pressed="false" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2 2"/><path d="M9 6 3 18h6z"/><path d="M15 6l6 12h-6z"/></svg>
    </button>
    <button id="lock" aria-label="Lock outline to reference framing" aria-pressed="true" hidden></button>
    <button id="torch" aria-label="Flash" aria-pressed="false" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
    </button>
  </div>
  <div id="toast"></div>
  <button id="refBtn" class="empty" aria-label="Reference photos">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Reference</span>
  </button>
  <div id="zoom"></div>
  <div id="flash"></div>
</div>

<div id="bottom">
  <div class="row" id="camRow">
    <button id="lastBtn" class="none" aria-label="Last photo"></button>
    <button id="shutter" aria-label="Take photo" disabled></button>
    <button id="flip" aria-label="Switch camera">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 13a8 8 0 0 0 14.6 4.5"/><path d="M5 3v4h4M19 21v-4h-4"/></svg>
    </button>
  </div>
  <div class="btns" id="shotRow" hidden>
    <button class="btn" id="retake">Retake</button>
    <button class="btn" id="mirror" aria-pressed="false">Mirror</button>
    <button class="btn primary" id="save">Save photo</button>
  </div>
  <div class="btns" id="errRow" hidden><button class="btn" id="retry">Try again</button></div>
</div>

<div id="sheet" hidden>
  <div id="sheetBox" role="dialog" aria-label="Reference photos">
    <div id="sheetHead"><h2>Reference</h2><button class="btn" id="done" style="padding:8px 18px">Done</button></div>
    <img id="big" alt="Selected reference" hidden>
    <div id="bigNone">No reference. The app uses its general framing tips.<br><br>Add a photo whose angle and pose you like, and the app will guide you to match it.</div>
    <textarea id="note" placeholder="Vibe note: e.g. light, careless, mid-step, looking away" hidden></textarea>
    <div id="strip"></div>
    <p id="sheetMsg"></p>
    <div class="btns"><button class="btn danger" id="remove" hidden>Remove this reference</button></div>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script type="module">
import {FilesetResolver,PoseLandmarker} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const M_LITE='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const M_FULL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task';

const $=id=>document.getElementById(id);
const video=$('video'),overlay=$('overlay'),octx=overlay.getContext('2d'),frameEl=$('frame'),shutter=$('shutter');
let fileset=null,live=null,still=null,running=false,frozen=false,stream=null,track=null,caps={},zoom=1,nativeZoom=false,front=false;
let smooth=null,smoothW=null,lastTs=0;

// ---------- storage ----------
const DB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('framecoach',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('refs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('refs',mode);const q=fn(t.objectStore('refs'));
    t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error);});};
  return {all:()=>tx('readonly',s=>s.getAll()),put:r=>tx('readwrite',s=>s.put(r)),del:id=>tx('readwrite',s=>s.delete(id))};})();
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let refs=[],activeRef=null;
const saveRef=r=>DB.put({id:r.id,img:r.img,kp:r.kp,w:r.w,note:r.note||'',mode:r.mode,mirror:!!r.mirror,created:r.created}).catch(()=>{});

// ---------- models ----------
async function makeLM(path,mode){
  if(!fileset)fileset=await FilesetResolver.forVisionTasks(WASM);
  for(const delegate of ['GPU','CPU']){
    try{return await PoseLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:path,delegate},runningMode:mode,numPoses:1});}
    catch(e){if(delegate==='CPU')throw e;}
  }
}
let stillP=null;const getStill=()=>stillP||(stillP=makeLM(M_FULL,'IMAGE'));

// ---------- camera ----------
async function startCamera(){
  msg('Starting the camera…');$('errRow').hidden=true;
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:front?'user':'environment'},width:{ideal:1920},height:{ideal:1440}}});
    video.srcObject=stream;await video.play();
    track=stream.getVideoTracks()[0];caps=(track.getCapabilities&&track.getCapabilities())||{};
    $('torch').hidden=!caps.torch;$('torch').classList.remove('on');updatePill();
    setupZoom();
    if(!live){msg('Loading the pose model…');live=await makeLM(M_LITE,'VIDEO');}
    shutter.disabled=false;msg('');resetStable();
    if(!running){running=true;requestAnimationFrame(loop);}
    migrate();
  }catch(e){console.error(e);
    msg('Camera or model failed to start.<br>Allow camera access, check your connection, then tap Try again.');$('errRow').hidden=false;}
}
$('retry').onclick=startCamera;
$('flip').onclick=()=>{front=!front;smooth=null;smoothW=null;startCamera();};
$('torch').onclick=()=>{const on=!$('torch').classList.contains('on');
  track.applyConstraints({advanced:[{torch:on}]}).then(()=>{$('torch').classList.toggle('on',on);$('torch').setAttribute('aria-pressed',on);}).catch(()=>{});};

// ---------- screen <-> video ----------
const fr=()=>frameEl.getBoundingClientRect();
function applyVideoTransform(){const f=fr(),cx=f.left+f.width/2,cy=f.top+f.height/2,z=nativeZoom?1:zoom;
  video.style.transformOrigin=`${cx}px ${cy}px`;video.style.transform=`${front?'scaleX(-1) ':''}scale(${z})`;}
function mapper(){
  const vw=video.videoWidth,vh=video.videoHeight,SW=video.clientWidth,SH=video.clientHeight,s0=Math.max(SW/vw,SH/vh),ox=(SW-vw*s0)/2,oy=(SH-vh*s0)/2;
  const f=fr(),cx=f.left+f.width/2,cy=f.top+f.height/2,z=nativeZoom?1:zoom;
  const v2s=(vx,vy)=>{if(front)vx=vw-vx;const bx=ox+vx*s0,by=oy+vy*s0;return {x:cx+(bx-cx)*z,y:cy+(by-cy)*z};};
  const s2v=(sx,sy)=>{const bx=cx+(sx-cx)/z,by=cy+(sy-cy)/z;let vx=(bx-ox)/s0;const vy=(by-oy)/s0;if(front)vx=vw-vx;return {x:vx,y:vy};};
  return {v2s,s2v,f,vw,vh};
}
let zMin=1,zMax=3,levels=[1,2,3],zAnim=0,zLastApply=0,zPending=null;
function setupZoom(){const box=$('zoom');box.innerHTML='';nativeZoom=false;zMin=1;zMax=3;levels=[1,2,3];
  if(caps.zoom&&caps.zoom.max>1){nativeZoom=true;zMin=Math.max(caps.zoom.min,0.5);zMax=Math.min(caps.zoom.max,10);levels=[];
    if(zMin<=0.5)levels.push(0.5);levels.push(1);if(zMax>=2)levels.push(2);if(zMax>=3)levels.push(3);}
  for(const z of levels){const b=document.createElement('button');b.dataset.z=z;b.onclick=e=>{e.stopPropagation();zoomTo(z);};box.appendChild(b);}
  zoom=1;applyZoom(1,true);}
function applyZoom(z,force){
  zoom=Math.min(zMax,Math.max(zMin,z));
  if(nativeZoom){const now=performance.now();zPending=zoom;
    if(force||now-zLastApply>45){zLastApply=now;track.applyConstraints({advanced:[{zoom:zPending}]}).catch(()=>{});}}
  applyVideoTransform();
  let act=levels[0];for(const l of levels)if(zoom>=l-0.01)act=l;
  for(const b of $('zoom').children){const v=+b.dataset.z,on=v===act;b.classList.toggle('on',on);
    b.textContent=on?(Math.round(zoom*10)/10)+'×':String(v);}
}
function zoomTo(target){cancelAnimationFrame(zAnim);const from=zoom,t0=performance.now(),D=280;
  const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);applyZoom(from+(target-from)*e,p===1);if(p<1)zAnim=requestAnimationFrame(step);};
  zAnim=requestAnimationFrame(step);}
// pinch to zoom on the frame
let pinch=null;
frameEl.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:zoom};cancelAnimationFrame(zAnim);}},{passive:true});
frameEl.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();const[a,b]=e.touches;
  applyZoom(pinch.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d);}},{passive:false});
frameEl.addEventListener('touchend',e=>{if(pinch&&e.touches.length<2){pinch=null;applyZoom(zoom,true);}});
addEventListener('resize',applyVideoTransform);

// ---------- landmarks ----------
// MediaPipe: 0 nose, 2/5 eyes, 7/8 ears, 11/12 shoulders, 13/14 elbows, 15/16 wrists, 23/24 hips, 25/26 knees, 27/28 ankles, 29/30 heels, 31/32 toes (odd = her left)
const SWAP=[0,4,5,6,1,2,3,8,7,10,9,12,11,14,13,16,15,18,17,20,19,22,21,24,23,26,25,28,27,30,29,32,31];
const VIS=0.5,ok=p=>p&&p.v>VIS,inF=p=>ok(p)&&p.x>=0&&p.x<=1&&p.y>=0&&p.y<=1;
const X=p=>p.x*3,Y=p=>p.y*4; // frame is 3:4 -> equal units
const mid=(k,a,b)=>ok(k[a])&&ok(k[b])?{x:(k[a].x+k[b].x)/2,y:(k[a].y+k[b].y)/2,v:1}:(ok(k[a])?k[a]:(ok(k[b])?k[b]:{x:0,y:0,v:0}));
const dist=(a,b)=>Math.hypot(X(a)-X(b),Y(a)-Y(b));
const deg=r=>r*180/Math.PI;
function mirrorKp(k){return k.map((p,i)=>{const s=k[SWAP[i]];return {x:1-s.x,y:s.y,v:s.v};});}
function mirrorW(w){return w.map((p,i)=>{const s=w[SWAP[i]];return {x:-s.x,y:s.y,z:s.z};});}
function elev(k,a,b){const dx=X(k[b])-X(k[a]),dy=Y(k[b])-Y(k[a]);return deg(Math.acos(Math.max(-1,Math.min(1,dy/Math.hypot(dx,dy)))));} // 0 = straight down, 180 = up
function bend(k,a,b,c){const v1x=X(k[a])-X(k[b]),v1y=Y(k[a])-Y(k[b]),v2x=X(k[c])-X(k[b]),v2y=Y(k[c])-Y(k[b]);
  return 180-deg(Math.acos(Math.max(-1,Math.min(1,(v1x*v2x+v1y*v2y)/(Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y))))));} // 0 = straight
const yaw=(w,l,r)=>deg(Math.atan2(w[l].z-w[r].z,w[l].x-w[r].x));
function feat(k,w){
  const sh=mid(k,11,12),hip=mid(k,23,24),nose=k[0];if(!ok(sh)||!ok(hip))return null;
  const torso=dist(sh,hip),headTop=ok(nose)?nose.y-0.7*Math.max(sh.y-nose.y,0.02):sh.y-0.25;
  const an=mid(k,27,28),full=inF(k[27])||inF(k[28]);
  let foot=0;for(const i of [27,28,29,30,31,32])if(ok(k[i]))foot=Math.max(foot,k[i].y);
  const f={k,sh,hip,cx:(sh.x+hip.x)/2,torso,headTop,full,foot,legRatio:full?(an.y-hip.y)/Math.max(hip.y-headTop,0.01):null};
  const has=(...ix)=>ix.every(i=>ok(k[i]));
  f.lean=deg(Math.atan2(X(sh)-X(hip),Y(hip)-Y(sh)));
  f.hipDrop=has(23,24)?(Y(k[23])-Y(k[24]))/Math.max(Math.abs(X(k[23])-X(k[24])),0.05):null;
  f.headRoll=has(2,5)?deg(Math.atan2(Y(k[2])-Y(k[5]),X(k[2])-X(k[5]))):null;
  f.crossed=has(23,24,27,28)?Math.sign(k[27].x-k[28].x)!==Math.sign(k[23].x-k[24].x):null;
  f.limb={};
  for(const [n,a,b,c] of [['lArm',11,13,15],['rArm',12,14,16],['lLeg',23,25,27],['rLeg',24,26,28]])
    f.limb[n]={elev:has(a,b)?elev(k,a,b):null,bend:has(a,b,c)?bend(k,a,b,c):null};
  f.lFoot=has(29,31)?deg(Math.atan2(Y(k[31])-Y(k[29]),X(k[31])-X(k[29]))):null;

const q=m=>Math.max(0,1-m*0.15); // quality from "how many thresholds off"

const SIDE={l:'left',r:'right'};

    let t;if(Math.sign(Lv)!==Math.sign(Rv)&&Math.abs(Rv)>15)t=`Turn her ${what} the other way`;
    else t=Math.abs(Lv)<Math.abs(Rv)?`Turn her ${what} more to the side`:`Turn her ${what} more toward the camera`;
    add(d/thr,1.5,id,t,hl,prio);};

const CHAINS=[[11,13],[13,15],[12,14],[14,16],[23,25],[25,27],[27,29],[27,31],[24,26],[26,28],[28,30],[28,32]];
const lenEMA={};
function retarget(Lk,Rk){

  for(const [a,b] of CHAINS){
    const rl=dist(Rk[a],Rk[b]);if(!rl)continue;
    let len=ok(Lk[a])&&ok(Lk[b])?dist(Lk[a],Lk[b]):rl*sc;const key=a+'-'+b;lenEMA[key]=lenEMA[key]?lenEMA[key]*.85+len*.15:len;len=lenEMA[key];
    const ux=(X(Rk[b])-X(Rk[a]))/rl,uy=(Y(Rk[b])-Y(Rk[a]))/rl;

function outline(k,f){

  octx.shadowColor='rgba(0,0,0,.5)';octx.shadowBlur=3;
